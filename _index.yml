indexpage:
  title: Documentação do NetApp Workload Factory
  summary: Comece a usar o NetApp Workload Factory para que você aproveite ao máximo
    suas cargas de trabalho de storage de nuvem. Após a conclusão da configuração,
    você poderá criar, otimizar e gerenciar seus sistemas de storage para suas cargas
    de trabalho, explorar a economia de custos, usar o copiloto de infraestrutura
    como código incorporado para automação em todas as plataformas e gerenciar suas
    cargas de trabalho no Workload Factory.
  keywords: Workload Factory, fsx, account, credentials, users, permissions, log in,
    calculator, codebox
  lead: Comece a usar o NetApp Workload Factory para que você possa aproveitar ao
    máximo suas cargas de trabalho ao usar o Amazon FSx for NetApp ONTAP e o OCI NetApp
    Storage Service. Depois que a configuração for concluída, você poderá criar, otimizar
    e gerenciar sistemas de arquivos do FSx for ONTAP para suas cargas de trabalho,
    explorar a economia de custos com o FSx for ONTAP, usar o copilot incorporado
    de Infrastructure-as-Code para automação em todas as plataformas e gerenciar suas
    cargas de trabalho no Workload Factory.
